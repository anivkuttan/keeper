name: keeper
description: A new Flutter project.

publish_to: "none"

version: 2.0.0-pre.1+4

environment:
  sdk: ^3.7.0
  flutter: ^3.29.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  flutter_bloc: ^9.1.0
  freezed: ^3.0.4
  intl: ^0.19.0
  build_runner: ^2.4.15
  smooth_page_indicator: ^1.2.1
  go_router: ^14.8.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  drift_db_viewer: ^2.1.0
  get_it: ^8.0.3
  equatable: ^2.0.7
  phone_form_field: ^10.0.5
  image_cropper: ^9.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  flutter_launcher_icons: "^0.14.3"
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"

  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  adaptive_icon_background: "assets/images/icon_background_yellow.png"
  min_sdk_android: 21
  adaptive_icon_monochrome: "assets/images/bg_123.png"
  # make icon frame (figma) by 432x432 make frame transprant (remove fill) and icon inside make color as little dark export as png
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
