name: keeper
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ^3.29.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  flutter_bloc: ^9.1.0
  freezed: ^3.0.3
  intl: ^0.20.2
  build_runner: ^2.4.15
  smooth_page_indicator: ^1.2.1
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  flutter_launcher_icons: "^0.14.3"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"

  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  adaptive_icon_background: "assets/images/icon_background_yellow.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
